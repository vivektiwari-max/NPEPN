<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login - NPEPN</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>NPEPN</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="#">Colleges</a>
            <a href="#">Jobs</a>
            <a href="#">Hackathons</a>
        </nav>

    </header>


    <main>

        <section class="registration">

            <div class="registration-heading">

                <p>STUDENT LOGIN</p>

                <h2>Welcome Back to NPEPN</h2>

                <span>
                    Login to access your student dashboard.
                </span>

            </div>


            <form id="loginForm">

                <div class="form-section">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                    >


                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                    >

                </div>


                <button type="submit">
                    Login
                </button>

            </form>
            <p>Don't have an account? <a href="student-register.html">Register here</a></p>

        </section>

    </main>


    <footer>

        <p>
            © 2026 NPEPN. All rights reserved.
        </p>

    </footer>


    <script src="student-login.js"></script>

</body>

</html>
